<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b31">
    <title>{{ page_title }} | {{ app_name }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='18' width='44' height='34' rx='12' fill='%2384e3cf'/%3E%3Ccircle cx='25' cy='34' r='4' fill='%23080b31'/%3E%3Ccircle cx='39' cy='34' r='4' fill='%23080b31'/%3E%3Crect x='23' y='43' width='18' height='4' rx='2' fill='%233f5175'/%3E%3Crect x='29' y='7' width='6' height='11' fill='%23ff5f26'/%3E%3Ccircle cx='32' cy='7' r='4' fill='%23ff5f26'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body class="login-page" data-locale="{{ locale }}">
    <main class="login-shell">
        <form class="login-card surface" method="post" action="/login">
            <div class="login-brand">
                <span class="brand-mascot" aria-hidden="true">
                    <span class="brand-mascot-eye brand-mascot-eye-left"></span>
                    <span class="brand-mascot-eye brand-mascot-eye-right"></span>
                </span>
                <strong>{{ app_name }}</strong>
            </div>
            <h1 class="login-title">{{ ui["login.title"] }}</h1>
            <p class="surface-note">{{ ui["login.subtitle"] }}</p>

            {% if login_error %}
            <p class="inline-error login-error" role="alert">{{ ui["login.error"] }}</p>
            {% endif %}

            <input type="hidden" name="next" value="{{ next_url }}">
            <label class="field">
                <span>{{ ui["login.username"] }}</span>
                <input type="text" name="username" autocomplete="username" autofocus required>
            </label>
            <label class="field">
                <span>{{ ui["login.password"] }}</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn-primary login-submit" type="submit">{{ ui["login.submit"] }}</button>
        </form>
    </main>
</body>
</html>
