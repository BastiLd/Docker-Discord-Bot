{% extends "base.html" %}

{% block page_body %}
<section class="database-layout">
    <article class="surface database-sidebar">
        <div class="surface-header toolbar-spread">
            <div class="title-block">
                <p class="section-label">{{ ui["nav.databases"] }}</p>
                <h1>{{ ui["databases.heading"] }}</h1>
                <p class="surface-note">{{ ui["databases.help"] }}</p>
            </div>
            <button class="btn btn-secondary" id="refreshDatabasesBtn" type="button">{{ ui["common.refresh"] }}</button>
        </div>
        <label class="field compact-field">
            <span>{{ ui["layout.search"] }}</span>
            <input id="databaseSearchInput" type="search" placeholder="{{ ui['databases.search'] }}">
        </label>
        <div class="database-list" id="databaseList"></div>
    </article>

    <article class="surface database-main">
        <div class="surface-header toolbar-spread">
            <div class="title-block">
                <p class="section-label" id="databasePathLabel">{{ ui["databases.no_selection"] }}</p>
                <h2 id="databaseTitle">{{ ui["databases.select_title"] }}</h2>
                <p class="surface-note" id="databaseMeta">{{ ui["databases.select_hint"] }}</p>
            </div>
            <div class="toolbar-actions">
                <select id="databaseTableSelect" disabled></select>
                <button class="btn btn-secondary" id="reloadTableBtn" type="button" disabled>{{ ui["common.refresh"] }}</button>
            </div>
        </div>

        <div class="database-table-wrap" id="databaseTableWrap">
            <div class="empty-state">{{ ui["databases.empty"] }}</div>
        </div>

        <form class="database-query-card" id="databaseQueryForm">
            <label class="field">
                <span>{{ ui["databases.query"] }}</span>
                <textarea id="databaseQueryInput" rows="4" placeholder="SELECT * FROM table_name LIMIT 50" disabled></textarea>
            </label>
            <div class="card-actions card-actions-end">
                <button class="btn btn-secondary" id="runDatabaseQueryBtn" type="submit" disabled>{{ ui["databases.run_query"] }}</button>
            </div>
        </form>
        <div class="database-query-result" id="databaseQueryResult"></div>
    </article>
</section>
{% endblock %}
